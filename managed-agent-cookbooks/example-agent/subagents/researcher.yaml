name: example-researcher
model: claude-sonnet-4-5
system:
  text: |
    You research a topic for the example agent. Pull from any configured MCP
    sources, then supplement with public sources. Return structured JSON.
    Read-only — you do not write files.
tools:
  - type: agent_toolset_20260401
    default_config: { enabled: false }
    configs:
      - { name: read, enabled: true }
      - { name: grep, enabled: true }
mcp_servers: []
skills: []
callable_agents: []
output_schema:
  type: object
  required: [topic, findings]
  additionalProperties: false
  properties:
    topic: { type: string, maxLength: 256 }
    findings:
      type: array
      minItems: 1
      maxItems: 20
      items:
        type: object
        additionalProperties: false
        required: [claim, source]
        properties:
          claim:  { type: string, maxLength: 512 }
          source: { type: string, maxLength: 512 }
    gaps:
      type: array
      maxItems: 10
      items: { type: string, maxLength: 256 }
