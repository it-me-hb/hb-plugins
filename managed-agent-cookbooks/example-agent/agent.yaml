# Example agent — managed-agent cookbook.
# Same system prompt as the plugin at ../../plugins/example-agent.

name: example-agent
model: claude-sonnet-4-5

system:
  file: ../../plugins/example-agent/agents/example-agent.md
  append: "You are running headless. Produce files in ./out/; do not assume an interactive session."

# The orchestrator dispatches and aggregates. It has read access to check
# intermediate outputs but never writes the final artifacts directly.
tools:
  - type: agent_toolset_20260401
    default_config: { enabled: false }
    configs:
      - { name: read, enabled: true }
      - { name: grep, enabled: true }
      - { name: glob, enabled: true }

mcp_servers: []

callable_agents:
  - { manifest: ./subagents/researcher.yaml }
  - { manifest: ./subagents/writer.yaml }       # only leaf with Write
