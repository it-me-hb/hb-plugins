# Build configuration. PACKAGE must match the package= attribute in
# AndroidManifest.xml — build_apk.sh checks this and stops if they drift.
APP_NAME="Template"
PACKAGE="com.example.app"
VERSION_NAME="1.0"
VERSION_CODE="1"

# 21 covers effectively every live device and gives framework Material theming.
MIN_SDK="21"
# Must be >= 24 or Android 15+ refuses to install. Independent of the
# android.jar you compile against — see references/install-gates.md.
TARGET_SDK="34"

KEYSTORE_PASS="android"
